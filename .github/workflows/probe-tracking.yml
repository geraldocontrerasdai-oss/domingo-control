name: Probar seguimiento de navieras y couriers

# Se ejecuta a mano. Escribe los números así, separados por coma:
#   ONE=ONEYXXXX,EGLV=EGLVXXXX,HLCU=HLCUXXXX,CROWLEY=CATXXXX,FEDEX=123456789012
# Códigos válidos: MSC, ONE, EGLV, HLCU, MAEU, CMDU, COSU, CROWLEY, FEDEX, DHL
on:
  workflow_dispatch:
    inputs:
      numbers: { description: "CODIGO=NUMERO separados por coma", required: true }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar navegador
        working-directory: worker
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Probar páginas
        working-directory: worker
        env:
          NUMBERS: ${{ inputs.numbers }}
        run: node probe.mjs
